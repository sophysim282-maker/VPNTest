name: Build VPNTest IPA
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
      - run: xcodebuild -project VPNTest.xcodeproj -scheme VPNTest -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/VPNTest.app Payload/
          zip -r VPNTest.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: VPNTest-ipa
          path: VPNTest.ipa
